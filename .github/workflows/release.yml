name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar Dependências
        run: dotnet restore MediaDownloader.csproj

      - name: Compilar e Publicar (Self-Contained win-x64)
        run: |
          dotnet publish MediaDownloader.csproj -c Release -r win-x64 --self-contained true -o ./publish

      - name: Compactar Versão Leve
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./MediaDownloader_Leve.zip -CompressionLevel Optimal

      - name: Baixar yt-dlp e FFmpeg para Versão Completa
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./publish/tools
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "./publish/tools/yt-dlp.exe"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "./ffmpeg.zip"
          Expand-Archive -Path ./ffmpeg.zip -DestinationPath ./ffmpeg_temp
          $binDir = Get-ChildItem -Path ./ffmpeg_temp -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1 -ExpandProperty DirectoryName
          Copy-Item "$binDir\ffmpeg.exe" -Destination "./publish/tools/"
          Copy-Item "$binDir\ffprobe.exe" -Destination "./publish/tools/"
          Remove-Item -Recurse -Force ./ffmpeg_temp, ./ffmpeg.zip

      - name: Compactar Versão Completa
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./MediaDownloader_Completo.zip -CompressionLevel Optimal

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MediaDownloader ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            MediaDownloader_Completo.zip
            MediaDownloader_Leve.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

